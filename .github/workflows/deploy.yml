name: Protected deployment
on:
  workflow_dispatch:
    inputs:
      source-sha:
        required: true
        type: string
      artifact-run:
        required: true
        type: string
      artifact-attempt:
        required: true
        type: string
      revision:
        required: true
        type: choice
        options: [flow-probe-v1, flow-probe-v2]
      previous-run:
        default: ''
        type: string
      previous-attempt:
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  deploy:
    if: github.repository == 'timmypai/hermes-teams-cd-public' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      source-sha: ${{ inputs.source-sha }}
      artifact-run: ${{ inputs.artifact-run }}
      artifact-attempt: ${{ inputs.artifact-attempt }}
      revision: ${{ inputs.revision }}
      previous-run: ${{ inputs.previous-run }}
      previous-attempt: ${{ inputs.previous-attempt }}
