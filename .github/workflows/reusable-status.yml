name: Reusable fresh allowlisted status
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      artifact-run:
        required: true
        type: string
      artifact-attempt:
        required: true
        type: string
      revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oracle-sevenbot-test-sevenbot-flow-probe
  cancel-in-progress: false
env:
  HELPER_SHA: 61735e88d27170439de9e2210b9748f9bf68795f
  SOURCE_SHA: ${{ inputs.source-sha }}
  ARTIFACT_RUN: ${{ inputs.artifact-run }}
  ARTIFACT_ATTEMPT: ${{ inputs.artifact-attempt }}
  REVISION: ${{ inputs.revision }}
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/bytecode
jobs:
  admit:
    if: >-
      github.repository == 'timmypai/hermes-teams-cd-public' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.workflow_ref == 'timmypai/hermes-teams-cd-public/.github/workflows/status.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: timmypai/hermes-teams-cd-public
          ref: 61735e88d27170439de9e2210b9748f9bf68795f
          path: shared
          persist-credentials: false
      - name: Admit fixed protected caller before Oracle scheduling
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 shared/scripts/workflow_entry.py gate status
  status:
    needs: admit
    if: needs.admit.result == 'success'
    environment: oracle-sevenbot-test
    runs-on: [self-hosted, Linux, ARM64, sevenbot-isolated]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: timmypai/hermes-teams-cd-public
          ref: 61735e88d27170439de9e2210b9748f9bf68795f
          path: shared
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: timmypai/hermes-teams-cd-public
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact-run }}
          name: image-${{ inputs.artifact-run }}-${{ inputs.artifact-attempt }}
          path: artifact
      - name: Collect current allowlisted version and functional health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 shared/scripts/workflow_entry.py run status
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 7
